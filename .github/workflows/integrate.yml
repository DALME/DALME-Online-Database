name: Integrate
# Every branch pushed here runs on its push. A PR only runs its own when it
# comes from a fork, whose pushes never reach this repository; one from a branch
# here would run twice.
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - development.v2
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

# A newer push cancels the run it supersedes, except on development.v2, whose
# runs are the ones that write the layer cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/development.v2' }}

permissions:
  contents: read

env:
  NAMESPACE: ida
  # Each list is the complement of `.github/hook-jobs.yml`, which says which
  # job each hook is for. The `hook-jobs` hook holds them to it.
  SKIP_APP: docs,eslint,migrations,prettier,tf-docs,tf-format,tf-validate,tfsec
  SKIP_TF: docs,eslint,migrations,prettier,ruff,ruff-format,uv-lock
  SKIP_UI: docs,migrations,ruff,ruff-format,tf-docs,tf-format,tf-validate,tfsec,uv-lock
  TAG: dev

# Every job runs on every push. What a change did not touch costs little,
# because its layers are cached, and a green commit is then one on which every
# gate passed, against that day's service images.
jobs:
  # The one place later jobs ask whether this run writes the layer cache. Only a
  # push to development.v2 does: what a branch writes is visible to that branch
  # alone, yet counts against the repository's cache cap, where it would evict
  # development.v2's layers.
  metadata:
    name: 'Metadata'
    if: >
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name != github.repository &&
      github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cache-write: ${{ steps.cache.outputs.write }}
    steps:
      - id: cache
        env:
          WRITE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development.v2' }}
        run: echo "write=$WRITE" >> "$GITHUB_OUTPUT"

  integrate_app:
    name: 'Integrate App'
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write  # The coverage comment.

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ida
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --no-sync
        options: >-
          --health-cmd "pg_isready -d ida -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      mysql:
        image: mysql:5.7.27
        env:
          MYSQL_DATABASE: resourcespace
          MYSQL_USER: dalme
          MYSQL_PASSWORD: dalme
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u dalme --password=dalme --ssl-mode=DISABLED"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3306:3306

      elasticsearch:
        image: elasticsearch:7.8.0
        env:
          ES_JAVA_OPTS: -Xms512m -Xmx512m
          bootstrap.memory_lock: true
          discovery.type: single-node
          xpack.security.enabled: false
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 9200:9200

    # The service connections, for every step that runs the built image with
    # `--network host`. The image carries no connection of its own.
    env:
      DAM_DB_HOST: 127.0.0.1
      DAM_DB_NAME: resourcespace
      DAM_DB_PASSWORD: dalme
      DAM_DB_PORT: 3306
      DAM_DB_USER: dalme
      ELASTICSEARCH_ENDPOINT: 127.0.0.1:9200
      POSTGRES_DB: ida
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PASSWORD: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-image
        with:
          image: app
          target: ci
          load: true
          tags: ${{ env.NAMESPACE }}.app:${{ env.TAG }}
          cache-write: ${{ needs.metadata.outputs.cache-write }}

      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: '0.5.11'
        env:
          SKIP: ${{ env.SKIP_APP }}

      - name: Services
        run: env | grep -E '^(DAM_DB|ELASTICSEARCH|POSTGRES)_' > "$RUNNER_TEMP/services.env"

      # The `migrations` hook, run against the built image and the service
      # databases rather than through compose, which would start its own. It
      # skips the system checks: Wagtail's build admin forms over tenanted
      # managers, and a tenant only exists inside a request, so under the CI
      # configuration they raise rather than fall back to the unscoped query.
      - name: Migrations
        run: >
          docker run --rm --network host
          --env-file "$RUNNER_TEMP/services.env"
          ${{ env.NAMESPACE }}.app:${{ env.TAG }}
          python manage.py makemigrations --check --dry-run --skip-checks

      - name: Test
        run: >
          docker run --rm --network host
          --env-file "$RUNNER_TEMP/services.env"
          -v /tmp:/tmp
          ${{ env.NAMESPACE }}.app:${{ env.TAG }}
          pytest
          --cov=.
          --cov-report=term-missing:skip-covered
          --hypothesis-show-statistics
          --junitxml=/tmp/pytest.xml
          | tee /tmp/pytest-coverage.txt

      - uses: MishaKav/pytest-coverage-comment@4cfb48edc8f875ac019afdcfd97c48d78ad2b723 # v1.13.1
        if: always()
        with:
          coverage-path-prefix: app/
          junitxml-path: /tmp/pytest.xml
          pytest-coverage-path: /tmp/pytest-coverage.txt

  integrate_docs:
    name: 'Integrate Docs'
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-image
        with:
          image: docs
          target: render
          cache-write: ${{ needs.metadata.outputs.cache-write }}

  integrate_terraform:
    name: 'Integrate Terraform'
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_PLUGIN_CACHE: .terraform.d/plugin-cache
      TFLINT_PLUGIN_CACHE: .tflint.d/plugins
    steps:
      - uses: actions/checkout@v7

      - run: mkdir -p ~/"$TF_PLUGIN_CACHE" ~/"$TFLINT_PLUGIN_CACHE"

      - uses: actions/cache@v6
        with:
          path: ~/${{ env.TF_PLUGIN_CACHE }}
          key: ${{ runner.os }}-tf-plugin-cache-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tf-plugin-cache-

      - uses: actions/cache@v6
        with:
          path: ~/${{ env.TFLINT_PLUGIN_CACHE }}
          key: ${{ runner.os }}-tflint-plugin-cache-${{ hashFiles('**/.tflint.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tflint-plugin-cache-

      - uses: ./.github/actions/build-image
        with:
          image: deploy
          target: tf
          load: true
          tags: ${{ env.NAMESPACE }}.deploy:${{ env.TAG }}
          cache-write: ${{ needs.metadata.outputs.cache-write }}

      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: '0.5.11'
        env:
          SKIP: ${{ env.SKIP_TF }}
          IN_CI: 1

      # The container writes into the checkout as root, and the runner cannot
      # clean up after the job unless it owns those files again.
      - if: always()
        run: sudo chown -R "$USER:$USER" tf/environments

  integrate_ui:
    name: 'Integrate UI'
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-image
        with:
          image: ui
          target: ci
          load: true
          tags: ${{ env.NAMESPACE }}.ui:${{ env.TAG }}
          cache-write: ${{ needs.metadata.outputs.cache-write }}

      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: '0.5.11'
        env:
          SKIP: ${{ env.SKIP_UI }}

      - name: Test
        run: >
          docker run --rm ${{ env.NAMESPACE }}.ui:${{ env.TAG }}
          yarn test:unit:ci

  # The single required check: green only if every job passed on this commit.
  # It is skipped with the rest when a PR's run is left to its branch's push.
  all_green:
    name: 'All green'
    if: always() && needs.metadata.result != 'skipped'
    needs:
      - metadata
      - integrate_app
      - integrate_docs
      - integrate_terraform
      - integrate_ui
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
