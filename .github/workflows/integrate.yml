name: Integrate
# Every branch pushed here runs on its push. A PR only runs its own when it
# comes from a fork, whose pushes never reach this repository; one from a branch
# here would run twice.
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - development.v2
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: write
  contents: write
  id-token: write  # OIDC permission.
  pull-requests: write

env:
  NAMESPACE: ida
  # Each list is the complement of `.github/hook-jobs.yml`, which says which
  # job each hook is for. The `hook-jobs` hook holds them to it.
  SKIP_APP: docs,eslint,migrations,prettier,tf-docs,tf-format,tf-validate,tfsec
  SKIP_TF: docs,eslint,migrations,prettier,ruff,ruff-format,uv-lock
  SKIP_UI: docs,migrations,ruff,ruff-format,tf-docs,tf-format,tf-validate,tfsec,uv-lock
  TAG: dev

jobs:
  metadata:
    name: 'Metadata'
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.changed-app.outputs.any_changed }}
      docs: ${{ steps.changed-docs.outputs.any_changed }}
      terraform: ${{ steps.changed-terraform.outputs.any_changed }}
      ui: ${{ steps.changed-ui.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      # A branch with no green run yet compares against where it left
      # development.v2, not against its last commit alone.
      - id: fork-point
        if: github.ref_name != 'development.v2'
        run: echo "sha=$(git merge-base HEAD origin/development.v2)" >> "$GITHUB_OUTPUT"

      - id: last-successful-commit
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          main-branch-name: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          workflow-id: 'integrate.yml'
          fallback-sha: ${{ steps.fork-point.outputs.sha }}

      # The pipeline's own configuration counts as a change to every job it
      # configures. Without it, a PR that edits the hooks or this workflow
      # gates itself out of the jobs it changes and reports green having run
      # none of them.
      - id: changed-app
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          base_sha: ${{ steps.last-successful-commit.outputs.base }}
          files: |
            app/**
            config/docker/Dockerfile.app
            pyproject.toml
            uv.lock
            .github/actions/**
            .github/hook-jobs.yml
            .github/workflows/integrate.yml
            .pre-commit-config.yaml
            Makefile
            Makefiles/**
            config/scripts/hook_*.py
            docker-compose.yml

      - id: changed-docs
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          base_sha: ${{ steps.last-successful-commit.outputs.base }}
          files: |
            docs/**
            config/docker/Dockerfile.docs
            pyproject.toml
            uv.lock
            .github/actions/**
            .github/workflows/integrate.yml

      - id: changed-terraform
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          base_sha: ${{ steps.last-successful-commit.outputs.base }}
          files: |
            tf/**
            config/docker/Dockerfile.deploy
            config/scripts/entrypoint.deploy.sh
            .github/actions/**
            .github/hook-jobs.yml
            .github/workflows/integrate.yml
            .pre-commit-config.yaml
            Makefile
            Makefiles/**
            config/scripts/hook_*.py
            docker-compose.yml

      - id: changed-ui
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          base_sha: ${{ steps.last-successful-commit.outputs.base }}
          files: |
            ui/**
            config/docker/Dockerfile.ui
            .github/actions/**
            .github/hook-jobs.yml
            .github/workflows/integrate.yml
            .pre-commit-config.yaml
            Makefile
            Makefiles/**
            config/scripts/hook_*.py
            docker-compose.yml

  integrate_app:
    name: 'Integrate App'
    needs: metadata
    if: needs.metadata.outputs.app == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ida
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --no-sync
        options: >-
          --health-cmd "pg_isready -d ida -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      mysql:
        image: mysql:5.7.27
        env:
          MYSQL_DATABASE: resourcespace
          MYSQL_USER: dalme
          MYSQL_PASSWORD: dalme
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u dalme --password=dalme --ssl-mode=DISABLED"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3306:3306

      elasticsearch:
        image: elasticsearch:7.8.0
        env:
          ES_JAVA_OPTS: -Xms512m -Xmx512m
          bootstrap.memory_lock: true
          discovery.type: single-node
          xpack.security.enabled: false
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 9200:9200

    # The service connections, for every step that runs the built image with
    # `--network host`. The image carries no connection of its own.
    env:
      DAM_DB_HOST: 127.0.0.1
      DAM_DB_NAME: resourcespace
      DAM_DB_PASSWORD: dalme
      DAM_DB_PORT: 3306
      DAM_DB_USER: dalme
      ELASTICSEARCH_ENDPOINT: 127.0.0.1:9200
      POSTGRES_DB: ida
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PASSWORD: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: ./.github/actions/build-image
        with:
          image: app
          target: ci
          load: true
          tags: ${{ env.NAMESPACE }}.app:${{ env.TAG }}

      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: '0.5.11'
        env:
          SKIP: ${{ env.SKIP_APP }}

      - name: Services
        run: env | grep -E '^(DAM_DB|ELASTICSEARCH|POSTGRES)_' > "$RUNNER_TEMP/services.env"

      # The `migrations` hook, run against the built image and the service
      # databases rather than through compose, which would start its own. It
      # skips the system checks: Wagtail's build admin forms over tenanted
      # managers, and a tenant only exists inside a request, so under the CI
      # configuration they raise rather than fall back to the unscoped query.
      - name: Migrations
        run: >
          docker run --rm --network host
          --env-file "$RUNNER_TEMP/services.env"
          ${{ env.NAMESPACE }}.app:${{ env.TAG }}
          python manage.py makemigrations --check --dry-run --skip-checks

      - name: Test
        run: >
          docker run --rm --network host
          --env-file "$RUNNER_TEMP/services.env"
          -v /tmp:/tmp
          ${{ env.NAMESPACE }}.app:${{ env.TAG }}
          pytest
          --cov=.
          --cov-report=term-missing:skip-covered
          --hypothesis-show-statistics
          --junitxml=/tmp/pytest.xml
          | tee /tmp/pytest-coverage.txt

      - uses: MishaKav/pytest-coverage-comment@4cfb48edc8f875ac019afdcfd97c48d78ad2b723 # v1.13.1
        with:
          coverage-path-prefix: app/
          junitxml-path: /tmp/pytest.xml
          pytest-coverage-path: /tmp/pytest-coverage.txt

  integrate_docs:
    name: 'Integrate Docs'
    needs: metadata
    if: needs.metadata.outputs.docs == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: ./.github/actions/build-image
        with:
          image: docs
          target: render

  integrate_terraform:
    name: 'Integrate Terraform'
    needs: metadata
    if: needs.metadata.outputs.terraform == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE: .terraform.d/plugin-cache
      TFLINT_PLUGIN_CACHE: .tflint.d/plugins
    steps:
      - uses: actions/checkout@v7

      - run: mkdir -p ~/"$TF_PLUGIN_CACHE" ~/"$TFLINT_PLUGIN_CACHE"

      - uses: actions/cache@v6
        with:
          path: ~/${{ env.TF_PLUGIN_CACHE }}
          key: ${{ runner.os }}-tf-plugin-cache-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tf-plugin-cache-

      - uses: actions/cache@v6
        with:
          path: ~/${{ env.TFLINT_PLUGIN_CACHE }}
          key: ${{ runner.os }}-tflint-plugin-cache-${{ hashFiles('**/.tflint.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tflint-plugin-cache-

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: ./.github/actions/build-image
        with:
          image: deploy
          target: tf
          load: true
          tags: ${{ env.NAMESPACE }}.deploy:${{ env.TAG }}

      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: '0.5.11'
        env:
          SKIP: ${{ env.SKIP_TF }}
          IN_CI: 1

      # The container writes into the checkout as root, and the runner cannot
      # clean up after the job unless it owns those files again.
      - run: sudo chown -R "$USER:$USER" tf/environments

  integrate_ui:
    name: 'Integrate UI'
    needs: metadata
    if: needs.metadata.outputs.ui == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: ./.github/actions/build-image
        with:
          image: ui
          target: ci
          load: true
          tags: ${{ env.NAMESPACE }}.ui:${{ env.TAG }}

      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: '0.5.11'
        env:
          SKIP: ${{ env.SKIP_UI }}

      - name: Test
        run: >
          docker run --rm ${{ env.NAMESPACE }}.ui:${{ env.TAG }}
          yarn test:unit:ci
