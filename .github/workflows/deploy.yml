name: Deploy
# Deploys are deliberate: a maintainer dispatches this by hand, against
# development.v2, once Integrate is green.
on:
  workflow_dispatch:

# A second dispatch waits for the first rather than cutting it off part way
# through a rollout or an asset sync.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # OIDC permission.

env:
  ACCOUNT: '209330743443'
  ENVIRONMENT: staging
  NAMESPACE: ida
  REGION: us-east-1
  ROLE: OIDCGithubActionsRole
  TAG: staging

jobs:
  metadata:
    name: 'Metadata'
    runs-on: ubuntu-latest
    outputs:
      image-prefix: ${{ steps.names.outputs.image-prefix }}
      role: ${{ steps.names.outputs.role }}
    steps:
      - if: github.ref_name != 'development.v2'
        run: |
          echo "::error::Only development.v2 deploys to ${ENVIRONMENT}, not ${GITHUB_REF_NAME}"
          exit 1

      - id: names
        run: |
          echo "image-prefix=${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/${NAMESPACE}" >> "$GITHUB_OUTPUT"
          echo "role=arn:aws:iam::${ACCOUNT}:role/${ROLE}" >> "$GITHUB_OUTPUT"

  build_app:
    name: 'Build App'
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.REGION }}
          role-to-assume: ${{ needs.metadata.outputs.role }}

      - uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ needs.metadata.outputs.image-prefix }}.app
          tags: |
            type=raw,priority=200,value=${{ env.TAG }}
            type=sha,priority=100,prefix=,format=long

      - uses: ./.github/actions/build-image
        with:
          image: app
          target: production
          build-args: |
            BUILD=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build_proxy:
    name: 'Build Proxy'
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.REGION }}
          role-to-assume: ${{ needs.metadata.outputs.role }}

      - uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ needs.metadata.outputs.image-prefix }}.proxy
          tags: |
            type=raw,priority=200,value=${{ env.TAG }}
            type=sha,priority=100,prefix=,format=long

      - uses: ./.github/actions/build-image
        with:
          image: proxy
          target: serve
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build_ui:
    name: 'Build UI'
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: oauth-client-id
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID_STAGING }}
        run: |
          value="${OAUTH_CLIENT_ID}.${NAMESPACE}.${ENVIRONMENT}"
          echo "::add-mask::$value"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-image
        with:
          image: ui
          target: production
          build-args: |
            ENV=${{ env.ENVIRONMENT }}
            BUILD=${{ github.sha }}
            OAUTH_CLIENT_ID=${{ steps.oauth-client-id.outputs.value }}
          load: true
          tags: ${{ env.NAMESPACE }}.ui:build

      - id: extract
        uses: shrink/actions-docker-extract@f1ef61065b78731fe3310b4e84e511f6a927a77e # v4
        with:
          image: ${{ env.NAMESPACE }}.ui:build
          path: /opt/ui/dist/spa/.

      - uses: actions/upload-artifact@v7
        with:
          name: build-artifact
          path: ${{ steps.extract.outputs.destination }}
          if-no-files-found: error
          include-hidden-files: true

  deploy_app:
    name: 'Deploy App'
    runs-on: ubuntu-latest
    needs: [metadata, build_app, build_proxy]
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.REGION }}
          role-to-assume: ${{ needs.metadata.outputs.role }}

      - run: >
          config/scripts/aws.ecs.deploy.sh
          --cluster "${NAMESPACE}-${ENVIRONMENT}-ecs-cluster"
          --service "${NAMESPACE}-${ENVIRONMENT}-ecs-service"
          --task "${NAMESPACE}-${ENVIRONMENT}-ida-ecs-task-definition-app"

  deploy_ui:
    name: 'Deploy UI'
    runs-on: ubuntu-latest
    needs: [metadata, deploy_app, build_ui]
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.REGION }}
          role-to-assume: ${{ needs.metadata.outputs.role }}

      - uses: actions/download-artifact@v8
        with:
          name: build-artifact
          path: ${{ runner.temp }}/dist

      - run: >
          aws s3 sync
          "${RUNNER_TEMP}/dist"
          "s3://${NAMESPACE}-${ENVIRONMENT}-assets-${ACCOUNT}"
          --delete

      # CloudFront is a global service, addressed through us-east-1 whatever
      # the region of everything else.
      - run: |
          arn=$(aws resourcegroupstaggingapi get-resources \
            --region us-east-1 \
            --resource-type-filters cloudfront \
            --tag-filters "Key=Name,Values=${NAMESPACE}-${ENVIRONMENT}-cloudfront" \
            --query 'ResourceTagMappingList[0].ResourceARN' \
            --output text)

          if [[ "$arn" != arn:* ]]; then
            echo "::error::No CloudFront distribution tagged ${NAMESPACE}-${ENVIRONMENT}-cloudfront"
            exit 1
          fi

          aws cloudfront create-invalidation \
            --distribution-id "${arn##*/}" \
            --paths '/db/*'
