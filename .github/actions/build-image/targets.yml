# The targets each image is built at in CI, keyed by image. An image's
# Dockerfile is `config/docker/Dockerfile.<image>`.
#
# The `build-image` action derives its cache scopes from this list, and the
# `hook-images` hook checks that every entry is a stage of its Dockerfile.

app: [ci, production]
deploy: [tf]
docs: [render]
proxy: [serve]
ui: [ci, production]
