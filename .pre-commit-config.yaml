default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: check-added-large-files
      args: ['--maxkb=10000']
    - id: check-ast
    - id: check-merge-conflict
    - id: debug-statements
    - id: detect-private-key
      exclude: ^app/\.config/oidc\.key$
    - id: end-of-file-fixer
      exclude: ^tf/.*README\.md$
    - id: forbid-new-submodules
    - id: trailing-whitespace

  # JavaScript
  - repo: local
    hooks:
    - id: eslint
      name: eslint
      entry: make ui.lint
      language: system
      types_or: [javascript, vue]
      files: ^ui/
      require_serial: true
      pass_filenames: false
    - id: prettier
      name: prettier
      entry: make ui.format
      language: system
      types_or: [javascript, vue, scss, html, json]
      files: ^ui/
      require_serial: true
      pass_filenames: false

  # Python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.9
    hooks:
      - id: uv-lock
        files: ^(uv\.lock|((app|docs)/)?pyproject\.toml)$

  - repo: local
    hooks:
    - id: migrations
      name: migrations
      entry: make db.migrations.check
      language: system
      types: [python]
      files: ^app/
      require_serial: true
      pass_filenames: false
    - id: hook-jobs
      name: hook-jobs
      entry: python config/scripts/hook_jobs.py
      language: python
      additional_dependencies: [pyyaml]
      files: ^(\.pre-commit-config\.yaml|\.github/hook-jobs\.yml|\.github/workflows/integrate\.yml)$
      pass_filenames: false
    - id: hook-targets
      name: hook-targets
      entry: python config/scripts/hook_targets.py
      language: python
      additional_dependencies: [pyyaml]
      files: ^(\.pre-commit-config\.yaml|Makefile|Makefiles/.*)$
      pass_filenames: false

  # Pipeline
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        entry: ghcr.io/hadolint/hadolint:v2.15.1 hadolint
        types: [text]
        files: ^config/docker/Dockerfile\.

  # Documentation
  - repo: local
    hooks:
    - id: docs
      name: docs
      entry: make docs.render
      language: system
      types_or: [python, markdown, rst]
      files: ^docs/
      require_serial: true

  # Terraform
  - repo: local
    hooks:
    - id: tf-format
      name: terraform fmt
      entry: make _deploy.format
      language: system
      types_or: [hcl, terraform]
      require_serial: true
    # Manual until the ops work under #62 restores the local provider cache;
    # run it with `prek run --hook-stage manual tf-validate`.
    - id: tf-validate
      name: terraform validate
      entry: make deploy.validate
      language: system
      types_or: [hcl, terraform]
      require_serial: true
      stages: [manual]
    - id: tf-docs
      name: terraform docs
      entry: make _deploy.docs
      language: system
      types_or: [hcl, terraform]
      require_serial: true
    - id: tfsec
      name: terraform tfsec
      entry: make _deploy.tfsec
      language: system
      types_or: [hcl, terraform]
      require_serial: true
