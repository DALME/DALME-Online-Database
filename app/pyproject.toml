[project]
name = "dalme-app"
version = "0.0.0"
requires-python = "==3.11.*"
dependencies = [
  "argon2-cffi==23.1.0",
  "Django==5.1.4",
  "Wand===0.6.13",
  "Werkzeug[watchdog]==3.1.3",
  "bibtexparser==1.4.3",
  "boto3==1.35.86",
  "cuid2==2.0.1",
  "django-configurations==2.5.1",
  "django-cors-headers==4.6.0",
  "django-currentuser==0.9.0",
  "django-elasticsearch-dsl==7.4",
  "django-filter==24.3",
  "django-maintenance-mode==0.21.1",
  "django-oauth-toolkit==3.0.1",
  "django-recaptcha==4.0.0",
  "django-sortedm2m==4.0.0",
  "django-storages==1.14.4",
  "django-tenants==3.9.0",
  "django_structlog==9.0.0",
  "djangorestframework-camel-case==1.4.2",
  "djangorestframework==3.15.2",
  "drf-access-policy==1.5.0",
  "drf-writable-nested==0.7.1",
  "elasticsearch-dsl==7.4.1",
  "elasticsearch==7.17.9",
  "geopy==2.4.1",
  "gunicorn==23.0.0",
  "lxml==5.3.0",
  "numpy==1.26.4",
  "opencv-python-headless==4.10.0.84",
  "pandas==2.2.3",
  "passlib==1.7.4",
  "psycopg==3.2.3",
  "psycopg-pool==3.3.3",
  "PyMySQL==1.2.4",
  "pyhumps==3.8.0",
  "pyzotero==1.5.28",
  "queryish==0.2",
  "requests-aws4auth==1.3.1",
  "requests==2.32.3",
  "regex==2024.11.6",
  "stringcase==1.2.0",
  "urllib3==1.26.18", # has to remain at this version because of elasticsearch
  "wagtail-font-awesome-svg==1.0.1",
  "wagtail==6.4.1",
  "wagtailcodeblock==1.29.0.2",
]

[dependency-groups]
dev = [
  "coverage==7.8.0",
  "django-debug-toolbar==5.2.0",
  "django-extensions==4.1",
  "factory_boy==3.3.3",
  "freezegun==1.5.1",
  "hypothesis==6.123.0",
  "ipdb==0.13.13",
  "ipython==9.9.0",
  "jupyter==1.0.0",
  "markdown==3.7",
  "moto[s3]==5.1.5",
  "notebook==6.5.6",
  "pydot==3.0.3",
  "pyjwt==2.10.1",
  "pyparsing==3.2.0",
  "pytest-cov==6.1.1",
  "pytest-django-queries==1.2.0",
  "pytest-django==4.11.1",
  "pytest-mock==3.14.0",
  "pytest-randomly==5.1.0",
  "pytest-structlog==1.1",
  "pytest-watcher==0.4.3",
  "pytest==8.3.5",
  "rich==14.0.0",
  "tqdm==4.67.1",
  "wagtail-factories==4.2.1",
  "watchdog==6.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = 'app.settings'
# pytest-randomly reseeds Faker and factory_boy each run and prints the seed.
# It keeps file order until #82 removes the tests' dependence on it.
addopts = "--strict-markers --reuse-db --randomly-dont-reorganize"
markers = [
  "integration: marks integration tests",
  "property: marks property tests",
  "unit: marks unit tests",
]

[tool.coverage.run]
omit = [
  "*/migrations/*",
  "app/tenants/management/commands/custom_createcachetable.py",
  "domain/management/commands/stages/migrate_data.py",
  "domain/management/commands/stages/*",
  "manage.py*",
  "*/tests/*",
]

# https://github.com/charliermarsh/ruff#configuration
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
ignore = [
  "A005",    # shadowing standard library modules
  "COM812",  # Recommended disable by ruff format.
  "D101",
  "D102",
  "D103",
  "D105",
  "D106",
  "D107",
  "D203",
  "D213",
  "DJ001",   # Worth doing, but not right now.
  "E501",
  "FBT002",
  "ISC001",  # Recommended disable by ruff format.
  "PLC1901", # Too many false positives.
  "RUF012",  # Typing related.
  "TD002",
  "TD003",
]
select = [
  "A",
  "ARG",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "D",
  "DTZ",
  "DJ",
  "E",
  "EM",
  "F",
  # "FBT",  # Worth doing, but not right now.
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PGH",
  "PIE",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "PT",
  # "PTH",  # Implies too much refactoring for the time being.
  # "Q",  # Implies double-quotes.
  "RET",
  "RUF",
  "RSE",
  "SLF",
  "SIM",
  "T",
  "T10",
  "T20",
  # "TD", # Crashing for GHP.
  "TID",
  "TRY",
  "UP",
  "W",
]
# This will warn but not autofix defined rules. For example, I've turned off
# autofixing of unused variables here (F841) because there are moments during
# refactoring when, if you temporarily remove a lone reference to a variable,
# autofix clobbers the chunk of code that is bound to that variable!
unfixable = ["F841"]

[tool.ruff.lint.per-file-ignores]
"*settings.py*" = [
  "RUF012", # mutable-class-default
  "N802",   # invalid-function-name
]
"*migrations*" = [
  "ARG001", # flake8-unused-arguments
  "D100",   # missing-docstring
  "E501",   # line-too-long
  "N806",   # non-lowercase-variable-in-function
  "RUF012", # mutable-class-default
]
"*tests*" = [
  "D103",    # undocumented-public-function
  "B018",    # useless-expression
  "INP001",  # implicit-namespace-package
  "PLR0913", # too-many-arguments
]

[tool.ruff.lint.isort]
known-first-party = ["app", "domain", "oauth", "search", "tenants", "web"]
section-order = [
  "future",
  "standard-library",
  "third-party",
  "django",
  "first-party",
  "local-folder",
  "tests",
]

[tool.ruff.lint.isort.sections]
django = ["django"]
tests = ["tests"]
